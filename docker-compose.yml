services:
  dashboard:
    build: .
    image: tool-using-agent-framework:dev
    container_name: agent_dashboard
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TRACE_DIR=/app/traces
    volumes:
      - ./traces:/app/traces
      - ./configs:/app/configs
    restart: unless-stopped
